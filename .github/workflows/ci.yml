name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: this workflow checks out the repo and
# runs tests, nothing more, and it runs code from pull requests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # matches backend/Dockerfile — test what ships
          cache: pip
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
        working-directory: .
      - name: Run backend tests
        run: pytest -q
        working-directory: .
      # The station map directory ships here too, with its own database and
      # its own suite. A schema migration that only fails against a database
      # that ALREADY exists went out green once and crash-looped on boot
      # (2026-09-14), so what a club runs is tested with what it runs.
      - name: Install map directory deps
        run: pip install -r requirements-dev.txt
        working-directory: map-directory
      - name: Run map directory tests
        run: pytest -q
        working-directory: map-directory

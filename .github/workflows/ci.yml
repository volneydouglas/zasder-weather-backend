name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches backend/Dockerfile — test what ships
          cache: pip
      - name: Install backend deps
        run: pip install -r requirements-dev.txt
        working-directory: .
      - name: Run backend tests
        run: pytest -q
        working-directory: .

name: Publish Docker image

# Build + push a versioned image to GitHub Container Registry (GHCR) on every
# release. Docker self-hosters then upgrade with `docker compose pull && up -d`
# instead of rebuilding from source. Also buildable manually from Actions.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx enable the multi-arch build below — without them the
      # image is amd64-only, and a Raspberry Pi (arm64) is the natural host
      # for a self-hosted install, so `docker compose pull` on a Pi would
      # fail with "no matching manifest".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zasder-weather-backend
          # type=ref,event=branch: manual (workflow_dispatch) runs happen on
          # a branch ref, where the semver patterns produce nothing and
          # `latest` is disabled — so a manual run used to build an image
          # with ZERO tags and push nothing useful. Tag those runs with the
          # branch name instead (e.g. :main), keeping release tags untouched.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 for typical servers, arm64 for Raspberry Pi self-hosters.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

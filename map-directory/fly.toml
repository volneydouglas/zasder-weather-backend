# The shared station map directory (2.3). One small always-on machine;
# the database is a few KB per station and lives on the volume.
app = "zasder-map-CHANGEME"
primary_region = "lax"

[build]

[env]
  DATABASE_PATH = "/data/map.db"

# Rolling, said out loud. NOT bluegreen: Fly's own reference is explicit
# that "the bluegreen strategy cannot be used for Machines with attached
# volumes" (the same for canary), and this app mounts one. What a rolling
# deploy WITH the health check below buys: the new machine has to pass
# /healthz before `fly deploy` reports success, so a build that dies at
# boot (the 2026-09-13 migration outage) fails the deploy loudly instead
# of sitting there as a green one.
[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /healthz opens the database and counts live beacons, so a machine
  # whose volume or schema is broken fails the check rather than serving
  # 500s. Modelled on backend/fly.toml.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[mounts]]
  source = "map_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # A worker thread calling into a closed loop is a shutdown bug, not
    # noise: the lifespan now reaps every app task and drains the
    # connections before the loop goes (2.3, main._reap_stray_app_tasks).
    error::pytest.PytestUnhandledThreadExceptionWarning

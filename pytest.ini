[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # NOT yet error::pytest.PytestUnhandledThreadExceptionWarning: on CI
    # (Linux, Python 3.12) worker threads still raise "Event loop is
    # closed" after a test's loop is torn down, in tests that pass clean
    # on a Mac with 3.11. Promote it to an error only after those sites
    # are fixed or ignored individually (2.2 plan, item 8).

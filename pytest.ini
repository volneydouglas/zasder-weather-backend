[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    # 2.2 (a 2.1 leftover): an exception escaping a worker thread is a test
    # failure, not a footnote in the warnings summary. No known site is
    # left; a new one fails its test instead of scrolling past.
    error::pytest.PytestUnhandledThreadExceptionWarning
